# Desarrollo local. Los tres microservicios que consume deben estar corriendo
# en la maquina (por ejemplo con el docker-compose de cada repo).
#
#   docker compose up --build
services:
  api:
    build: .
    container_name: ms-ficha-residente
    # network_mode host para poder alcanzar los puertos 9001/9002/9003 de la
    # maquina sin configurar redes entre proyectos de Compose.
    network_mode: host
    env_file: .env
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
